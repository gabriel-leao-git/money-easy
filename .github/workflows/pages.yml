# Publica o jogo no GitHub Pages a cada push no main.
# O Pages precisa do build (dist/): o index.html da raiz aponta pro src/ em TypeScript e fica em branco.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # O botão Download aponta pra ./instal-app.apk: o APK do repo vai junto no site.
      - name: Incluir o APK no site
        run: |
          if [ -f instal-app.apk ]; then
            cp instal-app.apk dist/
          else
            echo "::warning::instal-app.apk não está no repo: o botão Download vai dar 404"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
